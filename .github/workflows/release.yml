name: Build iOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Main.as
      - Probe-app.xml
      - build.py
      - cloud_build.py
      - simulator_smoke.py
      - simulator_runtime_diagnostics.py
      - loader_smoke.py
      - AppIconSource.png
      - adt.cfg
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      AQW_AIR_SDK: ${{ github.workspace }}/.air-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download AIR SDK
        shell: bash
        run: |
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 300 \
            'https://airsdk.wxlift.com/api/versions/51.3.4.2/sdks/AIRSDK_MacOS.zip?license=accepted' \
            --output "$RUNNER_TEMP/aqw-air-sdk.zip"
          mkdir -p "$AQW_AIR_SDK"
          unzip -q "$RUNNER_TEMP/aqw-air-sdk.zip" -d "$AQW_AIR_SDK"
          test -f "$AQW_AIR_SDK/lib/adt.jar"
          cp adt.cfg "$AQW_AIR_SDK/lib/adt.cfg"
      - name: Build IPA
        run: python3 cloud_build.py --sdk "$AQW_AIR_SDK"
      - name: Verify game import and Stage access
        run: python3 loader_smoke.py --sdk "$AQW_AIR_SDK"
      - name: Upload build and simulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-results
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = next(Path('output').glob('*-unsigned.ipa'))
          Path('output/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          PY
          gh release create v0.1.3 output/*-unsigned.ipa output/SHA256SUMS.txt \
            --title 'AQWorlds Classic 0.1.3' --prerelease --notes-file RELEASE_NOTES.md
          python3 - <<'PY'
          import base64, json, subprocess
          data = json.loads(subprocess.check_output(['gh', 'api', 'repos/${{ github.repository }}/contents/README.md']))
          text = base64.b64decode(data['content']).decode().replace('0.1.2', '0.1.3')
          text = text.replace('Physical-device testing is pending.', 'Version 0.1.2 starts on a physical iPhone. On-device testing of 0.1.3 is pending.')
          payload = {'message': 'Update download to 0.1.3', 'sha': data['sha'], 'content': base64.b64encode(text.encode()).decode()}
          subprocess.run(['gh', 'api', '--method', 'PUT', 'repos/${{ github.repository }}/contents/README.md', '--input', '-'], input=json.dumps(payload).encode(), check=True, stdout=subprocess.DEVNULL)
          PY
