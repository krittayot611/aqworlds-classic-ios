name: Build iOS release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a development release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - native-background.patch
      - native/**
      - build_margins.py
      - native_smoke.py
      - Main.as
      - MapRegression.as
      - Probe-app.xml
      - build.py
      - cloud_build.py
      - simulator_smoke.py
      - simulator_runtime_diagnostics.py
      - loader_smoke.py
      - AppIconSource.png
      - Background.jpg
      - adt.cfg
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      AQW_AIR_SDK: ${{ github.workspace }}/.air-sdk
    steps:
      - uses: actions/checkout@v7
      - name: Apply staged source update
        shell: bash
        run: |
          if [ -f native-background.patch ]; then
            git apply --check native-background.patch
            git apply native-background.patch
            python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('build_margins.py')
          p.write_text(p.read_text().replace("'+configname=air', '-source-path='", "'+configname=air', '-swf-version=14', '-source-path='"))
          s = p.read_text()
          s = s.replace("['-platform', platform, '-C',", "['-platform', platform, '-platformoptions', str(root / 'native/platform-ios.xml'), '-C',")
          p.write_text(s)
          Path('native/platform-ios.xml').write_text('<platform xmlns="http://ns.adobe.com/air/extension/33.1"><sdkVersion>12.0</sdkVersion><linkerOptions><option>-ios_version_min 12.0</option><option>-framework UIKit</option><option>-framework Foundation</option><option>-framework CoreGraphics</option></linkerOptions></platform>')
          descriptor = Path('native/extension.xml')
          descriptor.write_text(descriptor.read_text().replace('/extension/3.1', '/extension/33.1'))
          descriptor = Path('Probe-app.xml')
          descriptor.write_text(descriptor.read_text().replace('<key>UIDeviceFamily</key>', '<key>MinimumOSVersion</key><string>12.0</string><key>UIDeviceFamily</key>'))
          fixes = [('cloud_build.py',
            [('"-extdir", str(root / "build/extensions"), ', ''),
             ('str(temporary_ipa), str(root / "build/Probe-app.xml"),',
              'str(temporary_ipa), str(root / "build/Probe-app.xml"),\n'
              '            "-extdir", str(root / "build/extensions"),')]),
           ('build.py',
            [('"-extdir", str(build / "extensions"), ', ''),
             ('str(build / "Probe-app.xml"), "-C", str(build)',
              'str(build / "Probe-app.xml"), "-extdir", str(build / "extensions"), "-C", str(build)')]),
           ('native_smoke.py',
            [("'-extdir', root / 'build/extensions', ", ''),
             ("'-platformsdk', platform_sdk, '-C'",
              "'-platformsdk', platform_sdk, '-extdir', root / 'build/extensions', '-C'")])]
          for filename, replacements in fixes:
              p = Path(filename)
              text = p.read_text()
              for before, after in replacements:
                  if text.count(before) != 1:
                      raise RuntimeError('Unexpected packaging command in ' + filename)
                  text = text.replace(before, after, 1)
              p.write_text(text)
          PYFIX
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download AIR SDK
        shell: bash
        run: |
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 300 \
            'https://airsdk.wxlift.com/api/versions/51.3.4.2/sdks/AIRSDK_MacOS.zip?license=accepted' \
            --output "$RUNNER_TEMP/aqw-air-sdk.zip"
          mkdir -p "$AQW_AIR_SDK"
          unzip -q "$RUNNER_TEMP/aqw-air-sdk.zip" -d "$AQW_AIR_SDK"
          test -f "$AQW_AIR_SDK/lib/adt.jar"
          cp adt.cfg "$AQW_AIR_SDK/lib/adt.cfg"
      - name: Build IPA
        run: python3 cloud_build.py --sdk "$AQW_AIR_SDK"
      - name: Verify phone layout, map rasterisation and movement coordinates
        run: python3 loader_smoke.py --sdk "$AQW_AIR_SDK" --label phone
      - name: Verify tablet layout, map rasterisation and movement coordinates
        run: python3 loader_smoke.py --sdk "$AQW_AIR_SDK" --label tablet --screen-size 768x1024:768x1024
      - name: Verify native iOS background and transparent game area
        run: python3 native_smoke.py --sdk "$AQW_AIR_SDK"
      - name: Save verified source update
        shell: bash
        run: |
          if [ -f native-background.patch ]; then
            git rm native-background.patch
            git add Main.as MapRegression.as Probe-app.xml build.py cloud_build.py loader_smoke.py build_margins.py native_smoke.py RELEASE_NOTES.md native/NativeMargins.as native/MarginBackdrop.m native/extension.xml native/platform-ios.xml
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve game proportions and add native iOS backgrounds'
            git push origin HEAD:main
          fi
      - name: Upload build and simulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-results
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish development release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = next(Path('output').glob('*.ipa'))
          Path('output/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          PY
          gh release create v0.1.9 output/*.ipa output/SHA256SUMS.txt \
            --title 'AQWorlds Classic 0.1.9' --prerelease --notes-file RELEASE_NOTES.md
          python3 - <<'PY'
          import base64, json, subprocess
          data = json.loads(subprocess.check_output(['gh', 'api', 'repos/${{ github.repository }}/contents/README.md']))
          text = base64.b64decode(data['content']).decode().replace('0.1.8', '0.1.9')
          payload = {'message': 'Update download to 0.1.9', 'sha': data['sha'], 'content': base64.b64encode(text.encode()).decode()}
          subprocess.run(['gh', 'api', '--method', 'PUT', 'repos/${{ github.repository }}/contents/README.md', '--input', '-'], input=json.dumps(payload).encode(), check=True, stdout=subprocess.DEVNULL)
          PY

