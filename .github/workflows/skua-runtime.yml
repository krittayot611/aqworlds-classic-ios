name: Experimental C# runtime
on:
  push:
    branches: [unstable/skua-script-runtime]
    paths: ['experimental/SkuaMobile/**', '.github/workflows/skua-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project experimental/SkuaMobile/Checks -c Release
  ios-interpreter:
    needs: managed-checks
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install iOS toolchain
        run: dotnet workload install ios
      - name: Bundle compiler metadata
        shell: python
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['DOTNET_ROOT']) / 'packs/Microsoft.NETCore.App.Ref'
          versions = sorted(root.glob('10.*/ref/net10.0'), key=lambda p: tuple(map(int, p.parents[1].name.split('.'))))
          assert versions, 'No .NET 10 compiler metadata found'
          target = pathlib.Path('experimental/SkuaMobile/iOS/Metadata')
          target.mkdir(parents=True, exist_ok=True)
          for path in versions[-1].glob('*.dll'):
              shutil.copy2(path, target / path.name)
      - name: Build Release simulator app with interpreter
        run: |
          RID=iossimulator-arm64
          if [ "$(uname -m)" = x86_64 ]; then RID=iossimulator-x64; fi
          dotnet build experimental/SkuaMobile/iOS -c Release -r "$RID" -p:EnableCodeSigning=true -p:CodesignKey=- -p:CodesignRequireProvisioningProfile=false
      - name: Verify simulator code signature
        run: |
          APP=$(find experimental/SkuaMobile/iOS/bin/Release -name AqwScriptRuntimeCheck.app -type d -print -quit)
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Execute imported C# in iOS simulator
        run: |
          APP=$(find experimental/SkuaMobile/iOS/bin/Release -name AqwScriptRuntimeCheck.app -type d -print -quit)
          python3 experimental/SkuaMobile/run_ios_check.py --app "$APP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skua-runtime-check
          path: runtime-diagnostics/
          if-no-files-found: warn
